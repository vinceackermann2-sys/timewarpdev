name: Belna HyperFrames Frame-Matched Render

on:
  push:
    branches:
      - belna-hyperframes-cli-render
    paths:
      - "belna-hyperframes/**"
      - ".github/workflows/belna-hyperframes-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Rebuild frame-matched compositions
        run: python3 belna-hyperframes/generate_frame_matched.py

      - name: Fetch and verify exact Muse motion plate
        run: |
          mkdir -p belna-hyperframes/sv/assets belna-hyperframes/en/assets
          curl -fL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 2 --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://about.fb.com/wp-content/uploads/2026/09/Introducing-Muse_Sizzle-Video.mp4" \
            -o /tmp/reference.mp4
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/reference.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 /tmp/reference.mp4)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 /tmp/reference.mp4)
          FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 /tmp/reference.mp4)
          if [ -z "$FRAMES" ] || [ "$FRAMES" = "N/A" ]; then
            FRAMES=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 /tmp/reference.mp4)
          fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/reference.mp4)
          echo "plate: ${WIDTH}x${HEIGHT}, fps=${FPS}, frames=${FRAMES}, duration=${DURATION}"
          test "$WIDTH" = "1920"
          test "$HEIGHT" = "1080"
          test "$FPS" = "24/1"
          test "$FRAMES" = "1981"
          python3 -c 'import sys; d=float(sys.argv[1]); assert abs(d-82.541667) < 0.01, d' "$DURATION"
          cp /tmp/reference.mp4 belna-hyperframes/sv/assets/reference.mp4
          cp /tmp/reference.mp4 belna-hyperframes/en/assets/reference.mp4

      - name: Verify official HyperFrames CLI
        run: |
          npx --yes hyperframes@0.8.65 --version
          npx --yes hyperframes@0.8.65 doctor --json
          npx --yes hyperframes@0.8.65 browser ensure

      - name: Lint Swedish
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 lint

      - name: Lint English
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 lint

      - name: Check Swedish
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 check --samples 21 --at-transitions

      - name: Check English
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 check --samples 21 --at-transitions

      - name: Render Swedish frame-matched version
        working-directory: belna-hyperframes/sv
        run: |
          mkdir -p ../renders-v2
          npx --yes hyperframes@0.8.65 render --output ../renders-v2/belna_muse_frame_matched_sv.mp4 --fps 24 --quality delivery

      - name: Render English frame-matched version
        working-directory: belna-hyperframes/en
        run: |
          mkdir -p ../renders-v2
          npx --yes hyperframes@0.8.65 render --output ../renders-v2/belna_muse_frame_matched_en.mp4 --fps 24 --quality delivery

      - name: Verify final videos
        working-directory: belna-hyperframes
        run: |
          for f in renders-v2/*.mp4; do
            echo "=== $f ==="
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json "$f"
          done

      - name: Package
        working-directory: belna-hyperframes
        run: |
          cp sv/index.html belna_frame_matched_sv.html
          cp en/index.html belna_frame_matched_en.html
          zip -j belna_frame_matched_v2.zip renders-v2/*.mp4 belna_frame_matched_sv.html belna_frame_matched_en.html

      - name: Upload frame-matched renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belna-hyperframes-frame-matched-v2
          path: |
            belna-hyperframes/renders-v2/*.mp4
            belna-hyperframes/belna_frame_matched_v2.zip
            belna-hyperframes/sv/index.html
            belna-hyperframes/en/index.html
          if-no-files-found: error
          retention-days: 7
