name: Belna HyperFrames Frame-Matched Render

on:
  push:
    branches:
      - belna-hyperframes-cli-render
    paths:
      - "belna-hyperframes/**"
      - ".github/workflows/belna-hyperframes-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Rebuild exact frame-matched compositions
        run: |
          mkdir -p belna-hyperframes/sv belna-hyperframes/en
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          specs = {
              "sv": sorted(Path("belna-hyperframes/payloads/sv").glob("*.part")),
              "en": [Path("belna-hyperframes/payloads/en.html.gz.b64")],
          }
          for lang, paths in specs.items():
              encoded = "".join(p.read_text().strip() for p in paths)
              print(lang, "base64 chars", len(encoded))
              packed = base64.b64decode(encoded, validate=True)
              raw = gzip.decompress(packed)
              out = Path(f"belna-hyperframes/{lang}/index.html")
              out.write_bytes(raw)
              print(lang, "html bytes", len(raw), "sha256", hashlib.sha256(raw).hexdigest())
              assert len(raw) == 31982
          PY

      - name: Fetch and verify exact Muse motion plate
        run: |
          mkdir -p belna-hyperframes/sv/assets belna-hyperframes/en/assets
          curl -fL --connect-timeout 20 --max-time 300 --retry 3 --retry-delay 2 --retry-all-errors             -A "Mozilla/5.0"             "https://about.fb.com/wp-content/uploads/2026/09/Introducing-Muse_Sizzle-Video.mp4"             -o /tmp/reference.mp4

          python3 - <<'PY'
          import json, subprocess, sys
          p = subprocess.run([
              "ffprobe","-v","error","-select_streams","v:0","-count_frames",
              "-show_entries","stream=width,height,r_frame_rate,nb_read_frames",
              "-show_entries","format=duration","-of","json","/tmp/reference.mp4"
          ], check=True, capture_output=True, text=True)
          d = json.loads(p.stdout)
          s = d["streams"][0]
          duration = float(d["format"]["duration"])
          print("plate:", s["width"], s["height"], s["r_frame_rate"], s["nb_read_frames"], duration)
          assert s["width"] == 1920
          assert s["height"] == 1080
          assert s["r_frame_rate"] == "24/1"
          assert int(s["nb_read_frames"]) == 1981
          assert abs(duration - 82.541667) < 0.01
          PY

          cp /tmp/reference.mp4 belna-hyperframes/sv/assets/reference.mp4
          cp /tmp/reference.mp4 belna-hyperframes/en/assets/reference.mp4

      - name: Verify official HyperFrames CLI
        run: |
          npx --yes hyperframes@0.8.65 --version
          npx --yes hyperframes@0.8.65 doctor --json
          npx --yes hyperframes@0.8.65 browser ensure

      - name: Lint Swedish
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 lint

      - name: Lint English
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 lint

      - name: Check Swedish
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 check --samples 21 --at-transitions

      - name: Check English
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 check --samples 21 --at-transitions

      - name: Render Swedish frame-matched version
        working-directory: belna-hyperframes/sv
        run: |
          mkdir -p ../renders-v2
          npx --yes hyperframes@0.8.65 render --output ../renders-v2/belna_muse_frame_matched_sv.mp4 --fps 24 --quality delivery

      - name: Render English frame-matched version
        working-directory: belna-hyperframes/en
        run: |
          mkdir -p ../renders-v2
          npx --yes hyperframes@0.8.65 render --output ../renders-v2/belna_muse_frame_matched_en.mp4 --fps 24 --quality delivery

      - name: Verify final videos
        working-directory: belna-hyperframes
        run: |
          python3 - <<'PY'
          import glob, json, subprocess
          for f in glob.glob("renders-v2/*.mp4"):
              p = subprocess.run([
                  "ffprobe","-v","error","-select_streams","v:0","-count_frames",
                  "-show_entries","stream=codec_name,width,height,r_frame_rate,nb_read_frames",
                  "-show_entries","format=duration","-of","json",f
              ], check=True, capture_output=True, text=True)
              d=json.loads(p.stdout); s=d["streams"][0]; dur=float(d["format"]["duration"])
              print(f, s, dur)
              assert s["width"] == 1920 and s["height"] == 1080
              assert s["r_frame_rate"] == "24/1"
              assert int(s["nb_read_frames"]) == 1981
              assert abs(dur - 82.541667) < 0.02
          PY

      - name: Package
        working-directory: belna-hyperframes
        run: |
          cp sv/index.html belna_frame_matched_sv.html
          cp en/index.html belna_frame_matched_en.html
          zip -j belna_frame_matched_v2.zip renders-v2/*.mp4 belna_frame_matched_sv.html belna_frame_matched_en.html

      - name: Upload frame-matched renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belna-hyperframes-frame-matched-v2
          path: |
            belna-hyperframes/renders-v2/*.mp4
            belna-hyperframes/belna_frame_matched_v2.zip
            belna-hyperframes/sv/index.html
            belna-hyperframes/en/index.html
          if-no-files-found: error
          retention-days: 7
