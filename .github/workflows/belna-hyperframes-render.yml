name: Belna HyperFrames CLI Render

on:
  push:
    branches:
      - belna-hyperframes-cli-render
    paths:
      - "belna-hyperframes/**"
      - ".github/workflows/belna-hyperframes-render.yml"
  pull_request:
    branches:
      - main
    paths:
      - "belna-hyperframes/**"
      - ".github/workflows/belna-hyperframes-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      HYPERFRAMES_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify official HyperFrames CLI
        run: |
          npx --yes hyperframes@0.8.65 --version
          npx --yes hyperframes@0.8.65 doctor --json
          npx --yes hyperframes@0.8.65 browser ensure

      - name: Lint Swedish project
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 lint

      - name: Lint English project
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 lint

      - name: Check Swedish project
        working-directory: belna-hyperframes/sv
        run: npx --yes hyperframes@0.8.65 check --samples 13 --at-transitions

      - name: Check English project
        working-directory: belna-hyperframes/en
        run: npx --yes hyperframes@0.8.65 check --samples 13 --at-transitions

      - name: Render Swedish 24fps
        working-directory: belna-hyperframes/sv
        run: |
          mkdir -p ../renders
          npx --yes hyperframes@0.8.65 render --output ../renders/belna_muse_hyperframes_sv.mp4 --fps 24 --quality delivery

      - name: Render English 24fps
        working-directory: belna-hyperframes/en
        run: |
          mkdir -p ../renders
          npx --yes hyperframes@0.8.65 render --output ../renders/belna_muse_hyperframes_en.mp4 --fps 24 --quality delivery

      - name: Verify outputs
        working-directory: belna-hyperframes
        run: |
          for f in renders/*.mp4; do
            echo "=== $f ==="
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json "$f"
          done

      - name: Package
        working-directory: belna-hyperframes
        run: |
          cp sv/index.html belna_hyperframes_sv.html
          cp en/index.html belna_hyperframes_en.html
          zip -j belna_hyperframes_cli_renders.zip renders/*.mp4 belna_hyperframes_sv.html belna_hyperframes_en.html

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belna-hyperframes-cli-renders
          path: |
            belna-hyperframes/renders/*.mp4
            belna-hyperframes/belna_hyperframes_cli_renders.zip
            belna-hyperframes/sv/index.html
            belna-hyperframes/en/index.html
          if-no-files-found: error
          retention-days: 7
